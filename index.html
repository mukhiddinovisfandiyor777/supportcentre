<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>NOVA — личный Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
.aur{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aur i{position:absolute;width:80vmax;height:80vmax;border-radius:50%}
.aur i:nth-child(1){background:radial-gradient(circle,#a06bff55,#a06bff00 65%);left:-30%;top:-30%}.aur i:nth-child(2){background:radial-gradient(circle,#2ee6d633,#2ee6d600 65%);right:-35%;top:5%}.aur i:nth-child(3){background:radial-gradient(circle,#ff5fa833,#ff5fa800 65%);left:10%;bottom:-45%}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.app{display:grid;grid-template-columns:88px 1fr;gap:18px;padding:18px;max-width:1500px;margin:auto}
nav{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;gap:8px;align-items:center;padding:14px 8px;background:rgba(16,18,40,.95);border:1px solid var(--bd);border-radius:28px}
.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:800;color:#fff;margin-bottom:10px;box-shadow:0 0 30px #a06bff66}
nav button{all:unset;cursor:pointer;width:64px;padding:10px 0;border-radius:18px;text-align:center;color:var(--mu);font-size:10px;transition:.3s;position:relative}
nav button b{display:block;font-size:20px;font-weight:400;transition:.3s}
nav button:hover{color:var(--tx);transform:translateY(-2px)}
nav button.on{color:#fff;background:linear-gradient(135deg,#a06bff99,#2ee6d655);box-shadow:0 8px 24px #a06bff44}
nav button.on b{transform:scale(1.15)}
.sp{flex:1}
main{min-width:0}
.view{animation:vin .55s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.985)}}
h1{font-size:26px;margin:4px 0 16px;letter-spacing:-.5px}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.g{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--bd);border-radius:26px;padding:18px;position:relative;overflow:hidden;animation:vin .5s both;box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1)}
.card:active{opacity:.94}
.g>.card:nth-child(2){animation-delay:.06s}.g>.card:nth-child(3){animation-delay:.12s}.g>.card:nth-child(4){animation-delay:.18s}.g>.card:nth-child(5){animation-delay:.24s}.g>.card:nth-child(6){animation-delay:.3s}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.lb{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:8px}
.clk{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,#fff,var(--b) 60%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme=light] .clk{background:linear-gradient(90deg,#161a3a,var(--a));-webkit-background-clip:text;background-clip:text}
.clk small{font-size:26px;opacity:.6}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.mu{color:var(--mu)}
.map{width:100%;aspect-ratio:2/1;border-radius:18px;display:block;background:#0a0f24}
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.cty{padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--bd);font-size:12px}
.cty b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;outline:none;transition:.25s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 4px #a06bff33}
select option{color:#111}
textarea{width:100%;resize:vertical;min-height:80px}
.btn{all:unset;cursor:pointer;padding:10px 18px;border-radius:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 8px 22px #a06bff44;transition:.3s;position:relative;overflow:hidden;text-align:center}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px #ff5fa855}.btn:active{transform:scale(.96)}
.btn.gh{background:var(--card);border:1px solid var(--bd);box-shadow:none;color:var(--tx)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:11px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);animation:vin .4s both}
.it:last-child{border:0}.it .t{flex:1;min-width:0;overflow-wrap:anywhere}
.x{all:unset;cursor:pointer;color:var(--mu);padding:4px 8px;border-radius:8px}.x:hover{color:var(--c);background:#ff5fa822}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--mu);cursor:pointer;flex:none;display:grid;place-items:center;transition:.3s;font-size:14px;color:transparent}
.chk.on{background:linear-gradient(135deg,var(--b),var(--a));border-color:transparent;color:#fff}
.don{width:170px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;margin:auto;transition:1s}
.don>div{width:68%;height:68%;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;font-weight:800}
.ring{width:76px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:76%;height:76%;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));transition:.8s}
input[type=range]{padding:0;accent-color:var(--a);width:100%}
.tabs{display:flex;gap:6px;padding:5px;background:var(--card);border:1px solid var(--bd);border-radius:18px;width:max-content;max-width:100%;margin-bottom:16px;overflow:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 16px;border-radius:13px;color:var(--mu);transition:.3s;white-space:nowrap}.tabs button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph div{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;transition:.3s}.ph div:hover{transform:scale(1.04)}
.ph img{width:100%;height:100%;object-fit:cover}.ph .x{position:absolute;top:6px;right:6px;background:#000a;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:#1b1f3d;color:#fff;padding:12px 20px;border-radius:16px;transition:.4s;z-index:9;border:1px solid var(--bd)}.toast.on{transform:translate(-50%,0);opacity:1}
.sky{height:175px;border-radius:18px;position:relative;overflow:hidden;transition:2s}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.em{text-align:center;color:var(--mu);padding:26px 0}
@media(max-width:900px){.app{grid-template-columns:1fr;padding:12px 12px 96px}
nav{position:fixed;top:auto;bottom:max(10px,env(safe-area-inset-bottom,0px));left:10px;right:10px;height:auto;flex-direction:row;justify-content:space-around;padding:6px;z-index:5;border-radius:24px}
.logo,.sp{display:none}nav button{width:auto;flex:1;padding:6px 0}
.g>.card{grid-column:span 12!important}.g>.card.s3{grid-column:span 6!important}.clk{font-size:54px}.big{font-size:28px}.g{gap:12px}}

function pdf(){if(!window.jspdf)return toast('PDF-модуль не загрузился');const d=new jspdf.jsPDF(),mo=new Date().toISOString().slice(0,7),L=S.exp.filter(e=>e.d.startsWith(mo)).sort((a,b)=>a.d.localeCompare(b.d)),tot=L.reduce((a,e)=>a+e.a,0);d.setFillColor(20,18,50);d.rect(0,0,210,36,'F');d.setTextColor(255);d.setFontSize(22);d.text('NOVA | Monthly report '+mo,14,22);d.setFontSize(10);d.text('Generated '+new Date().toLocaleDateString('en-GB'),14,30);d.setTextColor(30);d.setFontSize(14);d.text('Total spent: '+fmt(tot).replace(/\s/g,' ')+' UZS',14,50);let y=62;d.setFontSize(11);Object.keys(CATS).forEach(k=>{const v=L.filter(e=>e.c==k).reduce((a,e)=>a+e.a,0);if(!v)return;d.setFillColor(...CATS[k].match(/\w\w/g).map(h=>parseInt(h,16)));d.rect(14,y-4,Math.max(2,v/tot*100),5,'F');d.text(tr(k)+': '+fmt(v),120,y);y+=9});y+=6;d.setFontSize(10);d.text('Date',14,y);d.text('Category',40,y);d.text('Note',80,y);d.text('Amount',170,y);y+=3;d.line(14,y,196,y);y+=7;L.forEach(e=>{if(y>280){d.addPage();y=20}d.text(e.d,14,y);d.text(tr(e.c),40,y);d.text(tr(e.n||'').slice(0,40),80,y);d.text(fmt(e.a),170,y);y+=7});y+=8;if(y>260){d.addPage();y=20}d.setFontSize(12);d.text('Goals',14,y);y+=7;d.setFontSize(10);S.goals.forEach(g=>{d.text(tr(g.n).slice(0,60)+' - '+g.p+'%',14,y);y+=6});saveBlob('nova-report-'+mo+'.pdf',d.output('blob'))}
function img(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=fr.result};fr.readAsDataURL(f)})}
